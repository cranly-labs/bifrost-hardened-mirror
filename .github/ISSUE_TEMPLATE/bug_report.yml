name: Bug report
description: Report a distribution build, deployment, or release automation defect.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the process in `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Distribution version
      description: The release tag, for example `v2.4.0`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Container image
        - Coolify deployment
        - Upstream synchronization
        - Release automation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, provider keys, and customer data.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, Docker version, Coolify version, and architecture.
