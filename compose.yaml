# Bifrost distribution v2.4.0.
# Rendered by the release workflow; production pins an immutable image digest.
#
# This file is intentionally free of proxy labels. Coolify owns Traefik routing,
# TLS, and domain configuration for the service.

name: bifrost

services:
  bifrost:
    image: "ghcr.io/cranly-labs/bifrost-hardened-mirror@sha256:b90f4b80d521b94d3778061435663deea96765ac0d799f5a92bb7c71001cde3f"
    restart: unless-stopped

    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      APP_DIR: "/app/data"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_STYLE: "${LOG_STYLE:-json}"
      # Required only for the first admin bootstrap. Coolify keeps it as a secret.
      BIFROST_SETUP_TOKEN: "${BIFROST_SETUP_TOKEN:-}"
      # Stable key for encrypted provider credentials. Never rotate this value.
      BIFROST_ENCRYPTION_KEY: "${BIFROST_ENCRYPTION_KEY:?BIFROST_ENCRYPTION_KEY must be set}"
      GOGC: "${GOGC:-200}"
      GOMEMLIMIT: "${GOMEMLIMIT:-1800MiB}"
      TZ: "${TZ:-UTC}"

    expose:
      - "8080"

    volumes:
      - bifrost-data:/app/data

    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "${BIFROST_CPU_LIMIT:-2}"
          memory: "${BIFROST_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.25"
          memory: "256M"

volumes:
  bifrost-data:
    name: "${BIFROST_VOLUME_NAME:-bifrost-data}"
